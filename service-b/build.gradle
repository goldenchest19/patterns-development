plugins {
    id "org.springframework.boot" version "3.2.5"
    id "io.spring.dependency-management" version "1.1.4"
    id "java"
}

ext {
    set("springCloudVersion", "2023.0.2")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.cloud:spring-cloud-starter-zookeeper-discovery"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"

    implementation project(":rpc-contract")
    implementation platform(libs.grpc.bom)
    implementation libs.grpc.netty
    implementation libs.grpc.stub

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
}

bootJar {
    mainClass = "com.example.serviceb.ServiceBApplication"
}

bootRun {
    doFirst {
        def forwarded = System.properties.findAll { key, value ->
            def k = key.toString()
            k.startsWith("grpc.") || k.startsWith("rate.") || k.startsWith("spring.")
        }
        systemProperties(forwarded)
    }
}
