spring.application.name=rate-printer
server.port=${SERVER_PORT:0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT:30s}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=${SCHEDULING_SHUTDOWN_TIMEOUT:30s}

grpc.client.deadline-millis=${GRPC_CLIENT_DEADLINE_MILLIS:3000}
grpc.client.shutdown-grace-period=${GRPC_CLIENT_SHUTDOWN_GRACE_PERIOD:30s}
rate.provider.service-name=${RATE_PROVIDER_SERVICE_NAME:currency-rate-provider}

spring.cloud.zookeeper.connect-string=${ZOOKEEPER_CONNECT_STRING:localhost:2181}
spring.cloud.zookeeper.discovery.root=${ZOOKEEPER_DISCOVERY_ROOT:/services}
spring.cloud.zookeeper.discovery.register=false

rate.base-currency=${RATE_BASE_CURRENCY:USD}
rate.quote-currency=${RATE_QUOTE_CURRENCY:RUB}
rate.poll-interval=${RATE_POLL_INTERVAL:5000}

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.access=unrestricted
management.endpoints.access.default=unrestricted
management.server.port=${MANAGEMENT_SERVER_PORT:8082}
management.metrics.tags.application=${spring.application.name}
