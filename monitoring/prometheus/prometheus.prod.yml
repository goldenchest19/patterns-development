global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: service-a-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-a-1:8081

  - job_name: service-a-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-a-2:8081

  - job_name: service-b
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - service-b:8082

  - job_name: zookeeper
    metrics_path: /metrics
    static_configs:
      - targets:
          - zookeeper:7001
