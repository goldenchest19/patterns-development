[versions]
java = "21"
grpc = "1.63.0"
protobuf = "3.25.3"
junit = "5.10.2"
slf4j = "2.0.12"
logback = "1.5.6"
protobufPlugin = "0.9.4"
javaxAnnotation = "1.3.2"

[libraries]
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf" }
grpc-netty = { module = "io.grpc:grpc-netty-shaded" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
javax-annotation = { module = "javax.annotation:javax.annotation-api", version.ref = "javaxAnnotation" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
