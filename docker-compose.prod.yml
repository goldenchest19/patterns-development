services:
  zookeeper:
    image: zookeeper:3.9
    container_name: pdris-prod-zookeeper
    ports:
      - "2181:2181"
      - "7001:7001"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,stat,conf,isro
      JVMFLAGS: >-
        -Dzookeeper.prometheusMetricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        -Dzookeeper.prometheusMetricsProvider.httpPort=7001

  service-a-1:
    image: rpc-multi-service/service-a:${RELEASE_VERSION:-dev}
    container_name: pdris-prod-service-a-1
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      GRPC_SERVER_PORT: 50051
      MANAGEMENT_SERVER_PORT: 8081
      RATE_BASE_VALUE: ${RATE_BASE_VALUE:-90.0}
      RATE_SPREAD: ${RATE_SPREAD:-1.0}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      GRPC_SERVER_SHUTDOWN_GRACE_PERIOD: ${GRPC_SERVER_SHUTDOWN_GRACE_PERIOD:-30s}
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: service-a-1
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_ID: currency-rate-provider-50051-${RELEASE_VERSION:-dev}
    ports:
      - "50051:50051"
      - "8081:8081"
    stop_grace_period: 35s

  service-a-2:
    image: rpc-multi-service/service-a:${RELEASE_VERSION:-dev}
    container_name: pdris-prod-service-a-2
    depends_on:
      - zookeeper
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      GRPC_SERVER_PORT: 50052
      MANAGEMENT_SERVER_PORT: 8081
      RATE_BASE_VALUE: ${RATE_BASE_VALUE:-90.0}
      RATE_SPREAD: ${RATE_SPREAD:-1.0}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      GRPC_SERVER_SHUTDOWN_GRACE_PERIOD: ${GRPC_SERVER_SHUTDOWN_GRACE_PERIOD:-30s}
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_HOST: service-a-2
      SPRING_CLOUD_ZOOKEEPER_DISCOVERY_INSTANCE_ID: currency-rate-provider-50052-${RELEASE_VERSION:-dev}
    ports:
      - "50052:50052"
      - "8083:8081"
    stop_grace_period: 35s

  service-b:
    image: rpc-multi-service/service-b:${RELEASE_VERSION:-dev}
    container_name: pdris-prod-service-b
    depends_on:
      - zookeeper
      - service-a-1
      - service-a-2
    environment:
      ZOOKEEPER_CONNECT_STRING: zookeeper:2181
      MANAGEMENT_SERVER_PORT: 8082
      RATE_PROVIDER_SERVICE_NAME: currency-rate-provider
      RATE_BASE_CURRENCY: ${RATE_BASE_CURRENCY:-USD}
      RATE_QUOTE_CURRENCY: ${RATE_QUOTE_CURRENCY:-RUB}
      RATE_POLL_INTERVAL: ${RATE_POLL_INTERVAL:-5000}
      GRPC_CLIENT_DEADLINE_MILLIS: ${GRPC_CLIENT_DEADLINE_MILLIS:-3000}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-30s}
      GRPC_CLIENT_SHUTDOWN_GRACE_PERIOD: ${GRPC_CLIENT_SHUTDOWN_GRACE_PERIOD:-30s}
      SCHEDULING_SHUTDOWN_TIMEOUT: ${SCHEDULING_SHUTDOWN_TIMEOUT:-30s}
    ports:
      - "8082:8082"
    stop_grace_period: 35s

  pact-broker-db:
    image: postgres:16
    container_name: pdris-prod-pact-db
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pdris-prod-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_PORT: 9292
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact
      PACT_BROKER_LOG_LEVEL: INFO

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: pdris-prod-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pdris-prod-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
