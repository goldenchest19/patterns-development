plugins {
    id "org.springframework.boot" version "3.2.5"
    id "io.spring.dependency-management" version "1.1.4"
    id "java"
}

ext {
    set("springCloudVersion", "2023.0.2")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.cloud:spring-cloud-starter-zookeeper-discovery"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "io.micrometer:micrometer-registry-prometheus"

    implementation project(":rpc-contract")
    implementation platform(libs.grpc.bom)
    implementation libs.grpc.netty
    implementation libs.grpc.stub

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation "au.com.dius.pact.provider:junit5:4.6.15"
}

bootJar {
    mainClass = "com.example.servicea.ServiceAApplication"
}

springBoot {
    buildInfo()
}

bootRun {
    doFirst {
        def forwarded = System.properties.findAll { key, value ->
            def k = key.toString()
            k.startsWith("grpc.") || k.startsWith("rate.") || k.startsWith("spring.")
                    || k.startsWith("management.") || k.startsWith("server.")
        }
        systemProperties(forwarded)
    }
}

test {
    systemProperty "pactbroker.url", System.getProperty("pactbroker.url", "http://localhost:9292")
    systemProperty "pact.verifier.publishResults", System.getProperty("pact.verifier.publishResults", "true")
    systemProperty "pact.provider.version", project.version.toString()
}

tasks.register("pactVerifyFromBroker", Test) {
    group = "verification"
    description = "Verifies rate-provider contracts from Pact Broker"
    useJUnitPlatform()
    filter {
        includeTestsMatching("com.example.servicea.contract.RateProviderPactVerificationTest")
    }
    systemProperty "pactbroker.url", System.getProperty("pactbroker.url", "http://localhost:9292")
    systemProperty "pact.verifier.publishResults", System.getProperty("pact.verifier.publishResults", "true")
    systemProperty "pact.provider.version", project.version.toString()
}
