services:
  zookeeper:
    image: zookeeper:3.9
    container_name: pdris-zookeeper
    ports:
      - "2181:2181"
      - "7001:7001"
    environment:
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,stat,conf,isro
      JVMFLAGS: >-
        -Dzookeeper.prometheusMetricsProvider.className=org.apache.zookeeper.metrics.prometheus.PrometheusMetricsProvider
        -Dzookeeper.prometheusMetricsProvider.httpPort=7001

  pact-broker-db:
    image: postgres:16
    container_name: pdris-pact-db
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact
      POSTGRES_PASSWORD: pact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact -d pact_broker"]
      interval: 5s
      timeout: 5s
      retries: 10

  pact-broker:
    image: pactfoundation/pact-broker:latest
    container_name: pdris-pact-broker
    depends_on:
      pact-broker-db:
        condition: service_healthy
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_PORT: 9292
      PACT_BROKER_BASE_URL: http://localhost:9292
      PACT_BROKER_DATABASE_HOST: pact-broker-db
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact
      PACT_BROKER_DATABASE_PASSWORD: pact
      PACT_BROKER_LOG_LEVEL: INFO

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: pdris-prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pdris-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
